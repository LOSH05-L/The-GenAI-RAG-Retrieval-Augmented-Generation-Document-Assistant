<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokesh Reddy | JARVIS GenAI RAG Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --neon-glow: rgba(6, 182, 212, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh; 
            background-image: radial-gradient(circle at 50% 20%, #0f172a 0%, #030712 90%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 30px 20px; 
            overflow-x: hidden;
            cursor: default;
        }

        /* Custom Glowing HUD Cursor */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 12px;
            height: 12px;
            background: var(--accent-cyan);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--accent-cyan), 0 0 20px var(--accent-cyan);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            z-index: 9999;
        }

        .custom-cursor-ring {
            position: fixed;
            top: 0;
            left: 0;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(6, 182, 212, 0.5);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease-out, width 0.2s, height 0.2s;
            z-index: 9998;
        }

        body.hovering .custom-cursor {
            width: 20px;
            height: 20px;
            background: #3b82f6;
            box-shadow: 0 0 15px #3b82f6, 0 0 30px #3b82f6;
        }

        body.hovering .custom-cursor-ring {
            width: 50px;
            height: 50px;
            border-color: #3b82f6;
        }

        .container { width: 100%; max-width: 900px; z-index: 10; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-weight: 800; font-size: 1.25rem; color: #fff; font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .back-link:hover { color: var(--accent-cyan); }

        /* JARVIS Glowing Ring Header */
        .jarvis-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .jarvis-ring-container {
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .jarvis-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(6, 182, 212, 0.4);
            border-radius: 50%;
            animation: spin 10s linear infinite;
        }

        .jarvis-ring-outer {
            position: absolute;
            width: 120%;
            height: 120%;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-cyan);
            animation: spin-reverse 6s linear infinite;
        }

        .jarvis-core {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, var(--accent-cyan) 0%, var(--accent-blue) 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px var(--accent-cyan), 0 0 50px rgba(59, 130, 246, 0.6);
            animation: pulse-core 2s ease-in-out infinite alternate;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        @keyframes pulse-core { 0% { transform: scale(0.9); box-shadow: 0 0 15px var(--accent-cyan); } 100% { transform: scale(1.1); box-shadow: 0 0 35px var(--accent-cyan), 0 0 60px var(--accent-blue); } }

        .header-title { 
            font-size: 2.2rem; 
            font-weight: 800; 
            margin-bottom: 5px; 
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0 0 30px rgba(6,182,212,0.3);
        }
        .header-sub { color: var(--text-muted); font-size: 0.95rem; }

        /* Glass Card Container with Neon Glow */
        .glass-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(6, 182, 212, 0.2); 
            border-radius: 20px; 
            padding: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(6, 182, 212, 0.05); 
            margin-bottom: 20px; 
        }

        /* Upload Section */
        .upload-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        input[type="file"] { color: var(--text-muted); font-size: 0.9rem; }
        .upload-btn { 
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }
        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(6, 182, 212, 0.6); }
        #upload-status { font-size: 0.9rem; color: #34d399; margin-top: 8px; font-family: 'JetBrains Mono', monospace; }

        /* Chat Container */
        .chat-container { display: flex; flex-direction: column; height: 420px; }
        .chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            border-bottom: 1px solid rgba(255,255,255,0.06); 
            margin-bottom: 15px; 
            scroll-behavior: smooth;
        }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 0.95rem; line-height: 1.5; }
        .message.user { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 0 15px rgba(37,99,235,0.3); }
        .message.ai { background: rgba(30, 41, 59, 0.85); color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(6, 182, 212, 0.2); box-shadow: 0 0 15px rgba(0,0,0,0.3); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }

        /* Input Bar */
        .chat-input-row { display: flex; gap: 10px; }
        .chat-input { 
            flex: 1; 
            background: #0b0f19; 
            border: 1px solid rgba(6, 182, 212, 0.3); 
            border-radius: 12px; 
            padding: 12px 16px; 
            color: white; 
            font-size: 0.95rem; 
            outline: none; 
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .chat-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
        .send-btn { 
            background: var(--accent-cyan); 
            color: #030712; 
            border: none; 
            padding: 0 24px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }
        .send-btn:hover { background: #22d3ee; transform: scale(1.02); box-shadow: 0 0 25px rgba(6, 182, 212, 0.8); }
    </style>
</head>
<body>

<!-- Custom Cursor Elements -->
<div class="custom-cursor"></div>
<div class="custom-cursor-ring"></div>

<div class="container">
    <nav>
        <div class="logo">JARVIS.AI // Lokesh.Dev</div>
        <a href="index.html" class="back-link">← Back to Portfolio</a>
    </nav>

    <!-- Glowing JARVIS Ring Header -->
    <div class="jarvis-header">
        <div class="jarvis-ring-container">
            <div class="jarvis-ring-outer"></div>
            <div class="jarvis-ring"></div>
            <div class="jarvis-core"></div>
        </div>
        <h1 class="header-title">GenAI RAG Assistant</h1>
        <p class="header-sub">Autonomous Document Intelligence & Grounded Neural Retrieval</p>
    </div>

    <!-- Document Upload Card -->
    <div class="glass-card">
        <h3 style="font-size: 1.05rem; margin-bottom: 12px; color: #fff; font-family: 'JetBrains Mono', monospace;">📁 01. INGEST KNOWLEDGE SOURCE (.TXT)</h3>
        <div class="upload-row">
            <input type="file" id="docFile" accept=".txt">
            <button class="upload-btn" onclick="uploadDocument()">Initialize Indexing</button>
        </div>
        <div id="upload-status"></div>
    </div>

    <!-- Chat Interface Card -->
    <div class="glass-card">
        <h3 style="font-size: 1.05rem; margin-bottom: 12px; color: #fff; font-family: 'JetBrains Mono', monospace;">💬 02. NEURAL CHAT INTERFACE</h3>
        <div class="chat-container">
            <div id="chatBox" class="chat-box">
                <div class="message ai">JARVIS online. Upload a document above to establish context matrices, then query the database.</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="userInput" class="chat-input" placeholder="Query data matrices..." onkeypress="handleKey(event)">
                <button class="send-btn" onclick="sendMessage()">TRANSMIT</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://the-genai-rag-retrieval-augmented.onrender.com"; // Update to your Render backend URL upon deployment

    // Custom HUD Cursor Tracker Logic
    const cursor = document.querySelector('.custom-cursor');
    const ring = document.querySelector('.custom-cursor-ring');

    let mouseX = 0, mouseY = 0;
    let ringX = 0, ringY = 0;

    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        
        cursor.style.left = `${mouseX}px`;
        cursor.style.top = `${mouseY}px`;
    });

    function renderCursor() {
        ringX += (mouseX - ringX) * 0.2;
        ringY += (mouseY - ringY) * 0.2;
        
        ring.style.left = `${ringX}px`;
        ring.style.top = `${ringY}px`;
        
        requestAnimationFrame(renderCursor);
    }
    requestAnimationFrame(renderCursor);

    document.querySelectorAll('button, input, a').forEach(element => {
        element.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
        element.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
    });

    // Backend communication functions
    async function uploadDocument() {
        const fileInput = document.getElementById('docFile');
        const statusDiv = document.getElementById('upload-status');
        
        if (fileInput.files.length === 0) {
            statusDiv.style.color = '#ef4444';
            statusDiv.innerText = "ERROR: No data file selected.";
            return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        statusDiv.style.color = '#06b6d4';
        statusDiv.innerText = "Indexing document into memory matrices...";

        try {
            const res = await fetch(`${API_URL}/upload-doc`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            statusDiv.style.color = '#34d399';
            statusDiv.innerText = `>> ${data.message}`;
        } catch (err) {
            statusDiv.style.color = '#ef4444';
            statusDiv.innerText = "ERROR: Failed to connect to RAG backend.";
        }
    }

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const question = inputField.value.trim();

        if (!question) return;

        chatBox.innerHTML += `<div class="message user">${question}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="message ai" style="color: #94a3b8;">Computing neural response...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch(`${API_URL}/chat`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({question: question})
            });
            const data = await res.json();
            
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message ai">${data.answer}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (err) {
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message ai" style="color: #ef4444;">ERROR: Neural link interrupted.</div>`;
        }
    }

    function handleKey(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>
</body>
</html>
